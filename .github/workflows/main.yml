name: gprMax Kuber Simulation Workflow

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t pratiktech28/gprmax:latest -f Docker/Dockerfile .
          docker save pratiktech28/gprmax:latest > gprmax.tar

      - name: Set up Kubernetes (Kind Cluster)
        uses: helm/kind-action@v1.4.0
        with:
          cluster_name: gprmax-cluster

      - name: Load Image into Kind
        run: kind load image-archive gprmax.tar --name gprmax-cluster

      - name: Apply Kubernetes Config
        run: |
          kubectl apply -f Kubernetes/PV.yaml
          kubectl apply -f Kubernetes/PVC.yaml
          kubectl apply -f Kubernetes/main.yaml
          kubectl apply -f Kubernetes/aggregator-job.yaml

      - name: Buffer for Cluster Sync
        run: |
          echo "[*] Sleeping for 60 seconds... Workers ko database banane do."
          sleep 60 

      - name: Wait for Aggregator Job to Finish
        run: |
          echo "[*] Monitoring data-aggregator job..."
          kubectl wait --for=condition=complete job/data-aggregator --timeout=1800s

      - name: Extract Results from PVC
        if: always() # 👈 Fail ho ya pass, data nikaalna zaroori hai!
        run: |
          mkdir -p output_zip
          POD_NAME=$(kubectl get pods -l app=gprmax -o jsonpath='{.items[0].metadata.name}')
          echo "[+] Extracting from Pod: $POD_NAME"
          kubectl cp $POD_NAME:/data/final_summary.csv ./output_zip/final_summary.csv || echo "Summary missing"
          kubectl cp $POD_NAME:/data/simulation_registry.db ./output_zip/simulation_registry.db || echo "DB missing"

      - name: Upload Artifacts to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gprMax-Results-Attempt-31
          path: output_zip/