name: gprMax Kuber Simulation Workflow

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      run: |
        docker build -t pratiktech28/gprmax:latest -f Docker/Dockerfile .
        docker save pratiktech28/gprmax:latest > gprmax.tar

    - name: Set up Kubernetes (Kind Cluster)
      uses: helm/kind-action@v1.4.0
      with:
        cluster_name: gprmax-cluster

    - name: Load Image into Kind
      run: kind load image-archive gprmax.tar --name gprmax-cluster

    - name: Apply Kubernetes Config
      run: |
        kubectl apply -f Kubernetes/PV.yaml
        kubectl apply -f Kubernetes/PVC.yaml
        kubectl apply -f Kubernetes/main.yaml
        kubectl apply -f Kubernetes/aggregator-job.yaml

    - name: Buffer for Cluster Sync & Execution
      run: |
        echo "[*] Sleeping for 120s... to allow cluster to sync and jobs to start"
        sleep 120

    - name: Check Aggregator Status & Logs
      run: |
        echo "[*] Checking if Aggregator Pod is running..."
        kubectl get pods -l job-name=data-aggregator
        kubectl logs job/data-aggregator || echo "Logs not available yet"

    - name: Extract Results (The Shield)
      if: always()
      run: |
        mkdir -p output_zip
        echo "[*] Initializing Polling Loop for Distributed Data..."
        
        # INCREASED: 30 attempts, 20s sleep = 10 minutes buffer
        for i in {1..30}; do
          echo "[*] Checking for final_summary.csv... (Attempt $i/30)"
          
          if kubectl exec job/data-aggregator -- ls /data/final_summary.csv > /dev/null 2>&1; then
            echo "[+] SUCCESS: Data generated! Commencing extraction..."
            POD_NAME=$(kubectl get pods -l job-name=data-aggregator -o jsonpath='{.items[0].metadata.name}')
            kubectl cp $POD_NAME:/data/final_summary.csv ./output_zip/final_summary.csv
            kubectl cp $POD_NAME:/data/simulation_registry.db ./output_zip/simulation_registry.db
            break
          fi
          
          echo "[!] Simulation still in progress. Sleeping for 20s..."
          sleep 20
        done
    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: GSoC-Final-Results
        path: output_zip/