name: gprMax-Kuber-Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Kind Cluster
        uses: helm/kind-action@v1.4.0
        with:
          cluster_name: gprmax-automation

      - name: Build Simulation Image
        run: |
          docker build -t gprmax-simulation:latest -f Docker/Dockerfile .

      - name: Load Image and Set Context
        run: |
          kind load docker-image gprmax-simulation:latest --name gprmax-automation
          kubectl cluster-info

      - name: Deploy gprMax
        run: |
          kubectl apply -f Kubernetes/
          echo "Waiting for Simulation to initialize..."
          sleep 60 

      - name: Final Smash - Extract from PVC
        run: |
          mkdir -p results_temp
          
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: artifact-exporter
          spec:
            containers:
            - name: exporter
              image: busybox
              command: ["/bin/sh", "-c", "sleep 3600"]
              volumeMounts:
              - name: storage
                mountPath: /data
            volumes:
            - name: storage
              persistentVolumeClaim:
                claimName: gprmax-pvc
            restartPolicy: Never
          EOF

          echo "Waiting for exporter pod..."
          kubectl wait --for=condition=Ready pod/artifact-exporter --timeout=90s

          echo "Pulling artifacts from PVC..."
          kubectl cp artifact-exporter:/data/simulation_registry.db ./results_temp/simulation_registry.db
          kubectl cp artifact-exporter:/data/final_summary.csv ./results_temp/final_summary.csv
          
          kubectl delete pod artifact-exporter
          
          echo "Final Artifact Check:"
          ls -lh results_temp/

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: GSoC-Final-Artifacts
          path: results_temp/