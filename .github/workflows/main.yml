name: gprMax-Kuber-Automation

on:
  push:
    branches: [ fix/automation-actions ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Kind Cluster
        uses: helm/kind-action@v1.4.0
        with:
          cluster_name: gprmax-automation

      - name: Build Simulation Image
        run: |
          docker build -t gprmax-simulation:latest -f Docker/Dockerfile .

      - name: Load Image and Set Context
        run: |
          kind load docker-image gprmax-simulation:latest --name gprmax-automation
          kubectl cluster-info

      - name: Deploy gprMax
        run: |
          kubectl apply -f Kubernetes/
          echo "Waiting for Simulation to initialize..."
          sleep 60 

      - name: Final Smash - Scan and Force Extract
        run: |
          mkdir -p results_temp
          
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: artifact-exporter
          spec:
            containers:
            - name: exporter
              image: busybox
              command: ["/bin/sh", "-c", "sleep 3600"]
              volumeMounts:
              - name: storage
                mountPath: /data_mount
            volumes:
            - name: storage
              persistentVolumeClaim:
                claimName: gprmax-pvc
            restartPolicy: Never
          EOF

          echo "Waiting for exporter pod..."
          kubectl wait --for=condition=Ready pod/artifact-exporter --timeout=90s

          echo "Scanning PVC for any .db or .csv files..."
          kubectl exec artifact-exporter -- chmod -R 777 /data_mount
          kubectl exec artifact-exporter -- ls -R /data_mount
          
          echo "Copying entire data directory to avoid path errors..."
          kubectl cp artifact-exporter:/data_mount/ ./results_temp/ || echo "Copy failed but continuing..."
          
          kubectl delete pod artifact-exporter
          
          echo "Files Found in Runner:"
          find ./results_temp -type f
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: gprMax-Simulation-Results
          path: results_temp    