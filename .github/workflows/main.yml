name: gprMax K8s CI
on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubernetes (Kind)
        uses: engineerd/setup-kind@v0.5.0
        with:
          version: "v0.20.0"

      - name: Build Docker Image
        run: |
          docker build -t gprmax-simulation:latest .
          echo "Bhai, Jung Jeet Gaye!"

      - name: Load Image into Kind Cluster
        run: |
          # 🎯 FIX: Default cluster name 'kind' hota hai
          kind load docker-image gprmax-simulation:latest --name kind

      - name: Deploy Infrastructure
        run: |
          kubectl apply -f Kubernetes/  # Tere folder structure ke hisab se
          
          echo "Waiting for aggregator to finish..."
          # 🎯 FIX: Wait taaki artifacts generate ho jayein
          kubectl wait --for=condition=complete job/data-aggregator --timeout=300s

      - name: Extract Artifacts from /data (FIXED PATH)
        run: |
          mkdir -p results_temp
          POD_NAME=$(kubectl get pods -l job-name=data-aggregator -o jsonpath='{.items[0].metadata.name}')
          
          echo "Found Pod: $POD_NAME"
          # 🎯 CRITICAL FIX: Python code /data mein save kar raha hai [image_3b78c7.png]
          kubectl cp $POD_NAME:/data/simulation_registry.db ./results_temp/simulation_registry.db
          
          ls -la results_temp/

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: GSoC-Simulation-Results
          path: results_temp/