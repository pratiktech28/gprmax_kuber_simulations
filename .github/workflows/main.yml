name: gprMax Automation Phase 3

on:
  push:
    branches: [ fix/automation-actions ]

jobs:
  full-simulation-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kubernetes (Kind)
        uses: engineerd/setup-kind@v0.5.0
        with:
          version: "v0.20.0"

      - name: Build & Load Image
        run: |
          docker build -t gprmax-simulation:latest -f Docker/Dockerfile .
          kind load docker-image gprmax-simulation:latest --name kind

      - name: Deploy 10 Pods & Aggregator
        run: |
          # Maan raha hoon ki teri files 'k8s/' folder mein hain
          kubectl apply -f Kubernetes/
          
      - name: Wait for Completion
        run: |
          echo "Waiting for simulations to finish..."
          sleep 120
          kubectl get pods

      - name: Export Results from Cluster
        run: |
          mkdir -p ./Python/results
          
          POD_NAME=$(kubectl get pods -l job-name=data-aggregator -o jsonpath='{.items[0].metadata.name}')
          echo "Targeting Pod: $POD_NAME"
          
          kubectl cp $POD_NAME:/data/simulation_registry.db ./Python/results/simulation_registry.db
          kubectl cp $POD_NAME:/data/final_summary.csv ./Python/results/final_summary.csv
          
          ls -R ./Python/results/
      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: gprMax-Data-Results
          path: Python/results/