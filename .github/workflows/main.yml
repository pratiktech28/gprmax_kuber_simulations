name: gprMax Automation Phase 3

on:
  push:
    branches: [ fix/automation-actions ]

jobs:
  full-simulation-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kubernetes (Kind)
        uses: engineerd/setup-kind@v0.5.0
        with:
          version: "v0.20.0"

      - name: Build & Load Image
        run: |
          docker build -t gprmax-simulation:latest -f Docker/Dockerfile .
          kind load docker-image gprmax-simulation:latest --name kind

      - name: Deploy 10 Pods & Aggregator
        run: |
          # Maan raha hoon ki teri files 'k8s/' folder mein hain
          kubectl apply -f Kubernetes/
          
      - name: Wait for Completion
        run: |
          # Simulations ko time do khatam hone ka (Indori patience!)
          echo "Waiting for simulations to finish..."
          sleep 120 
          kubectl get pods

      - name: Collect Results (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: gprmax-simulation-results
          path: |
            Python/*.db
            Python/output/
            # Jo bhi paths tune aggregator.py mein diye hain