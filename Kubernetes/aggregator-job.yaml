apiVersion: batch/v1
kind: Job
metadata:
  name: data-aggregator
spec:
  template:
    spec:
      containers:
      - name: aggregator
        image: pratiktech28/gprmax:latest  
        command: ["python3", "aggregator.py"]
        imagePullPolicy: Never            
        volumeMounts:
        - name: data-volume
          mountPath: /data
      restartPolicy: Never
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: gprmax-pvc
  backoffLimit: 2