apiVersion: batch/v1
kind: Job
metadata:
  name: data-aggregator
spec:
  template:
    spec:
      containers:
      - name: aggregator
        image: gprmax-simulation:latest
        imagePullPolicy: Always  
        volumeMounts:
        - name: storage
          mountPath: /data 
      restartPolicy: Never
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: gprmax-pvc
---
